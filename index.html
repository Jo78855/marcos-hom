<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta name="theme-color" content="#8f2f0b"><title>ياسر العطار | بيع بالجملة</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#fffaf6;color:#2b180f}header{padding:22px 7%;border-bottom:1px solid #ead9cc;display:flex;justify-content:space-between;align-items:center;background:#fff}h1{margin:0;font-size:34px}.sub{color:#8b6a59;margin-top:5px}.pill{border:0;background:#8f2f0b;color:white;border-radius:14px;padding:11px 16px}main{width:min(1280px,94%);margin:auto}.promo{margin:22px 0;padding:24px;border-radius:24px;background:linear-gradient(90deg,#8f2f0b,#c65a0b);color:#fff}.section{margin:26px 0}.head{display:flex;justify-content:space-between;align-items:center}.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.cat{background:white;border:1px solid #ead9cc;border-radius:18px;padding:20px 8px;font-size:18px;cursor:pointer}.cat span{display:block;font-size:34px;margin-bottom:7px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #ead9cc;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px #5b2c1610}.card img{width:100%;height:220px;object-fit:cover;background:#f4e9df}.body{padding:18px}.body h3{font-size:24px;margin:0 0 8px}.meta{color:#957462}.price{font-weight:800;font-size:24px;color:#8f2f0b;margin:12px 0}.row{display:flex;gap:8px}.row input{width:85px;padding:10px}.btn{flex:1;border:0;background:#8f2f0b;color:#fff;border-radius:12px;padding:11px;font-weight:700}.badge{background:#8f2f0b;color:#fff;border-radius:99px;padding:6px 10px}.fab{position:fixed;bottom:18px;border:0;border-radius:99px;padding:14px 20px;font-weight:700;z-index:10}.wa{left:18px;background:#22c55e;color:white;text-decoration:none}.cart{right:18px;background:#8f2f0b;color:white}@media(max-width:800px){.cats{grid-template-columns:repeat(2,1fr)}.products{grid-template-columns:1fr}h1{font-size:28px}}</style></head>
<body><header><div><h1>ياسر العطار</h1><div class="sub">بيع بالجملة • <span id="status">جاهز</span></div></div><button class="pill" onclick="installApp()">تثبيت التطبيق</button></header><main><section class="promo"><b>عرض الشهر</b><h2>أسعار جملة مميزة</h2><div>تابع أحدث العروض والمنتجات من ياسر العطار</div></section><section class="section"><div class="head"><h2>الأقسام</h2><button onclick="filterCat('الكل')" style="border:0;background:transparent;color:#8f2f0b;font-size:17px">عرض الكل</button></div><div class="cats"><button class="cat" onclick="filterCat('توابل')"><span>🌶️</span>توابل</button><button class="cat" onclick="filterCat('بهارات')"><span>🧂</span>بهارات</button><button class="cat" onclick="filterCat('أعشاب')"><span>🌿</span>أعشاب</button><button class="cat" onclick="filterCat('بقوليات')"><span>🫘</span>بقوليات</button><button class="cat" onclick="filterCat('أخرى')"><span>🛒</span>أخرى</button></div></section><section class="section"><div class="head"><h2 id="title">كل المنتجات</h2><span id="count" class="badge">6</span></div><div id="products" class="products"></div></section></main><a class="fab wa" href="https://wa.me/201150150500" target="_blank">واتساب</a><button class="fab cart">🛒 السلة <span id="cartCount">0</span></button>
<script>const fallback=[{name:'فلفل أسود',category:'توابل',price:185,image_url:'https://images.unsplash.com/photo-1596040033229-a9821ebd058d?auto=format&fit=crop&w=900&q=80'},{name:'كمون',category:'بهارات',price:160,image_url:'https://images.unsplash.com/photo-1599909533730-f48b1fcbcd16?auto=format&fit=crop&w=900&q=80'},{name:'نعناع مجفف',category:'أعشاب',price:95,image_url:'https://images.unsplash.com/photo-1628556270448-4d4e4148e1b1?auto=format&fit=crop&w=900&q=80'},{name:'عدس',category:'بقوليات',price:75,image_url:'https://images.unsplash.com/photo-1615485500704-8e990f9900f7?auto=format&fit=crop&w=900&q=80'},{name:'كركم',category:'بهارات',price:135,image_url:'https://images.unsplash.com/photo-1615485737651-5806936d362c?auto=format&fit=crop&w=900&q=80'},{name:'فاصوليا بيضاء',category:'بقوليات',price:110,image_url:'https://images.unsplash.com/photo-1515543904379-3d757afe72e4?auto=format&fit=crop&w=900&q=80'}];let products=fallback,active='الكل',cart=0;function render(){const arr=active==='الكل'?products:products.filter(x=>x.category===active);count.textContent=arr.length;title.textContent=active==='الكل'?'كل المنتجات':active;document.getElementById('products').innerHTML=arr.map(p=>`<article class="card"><img src="${p.image_url||''}"><div class="body"><h3>${p.name}</h3><div class="meta">${p.category} • أقل كمية 1 كرتونة</div><div class="price">${Number(p.price||0).toLocaleString('ar-EG')} ج.م</div><div class="row"><input type="number" min="1" value="1"><button class="btn" onclick="cart++;cartCount.textContent=cart">إضافة للسلة</button></div></div></article>`).join('')}function filterCat(c){active=c;render()}function installApp(){alert('من قائمة المتصفح اختر: تثبيت التطبيق / إضافة إلى الشاشة الرئيسية')}render();</script></body></html>
